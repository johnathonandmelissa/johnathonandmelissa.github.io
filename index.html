<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#637545">
<title>Find Your Seat · Johnathon &amp; Melissa</title>
<meta property="og:title" content="Find Your Seat · Johnathon &amp; Melissa">
<meta property="og:description" content="Engagement Celebration seating chart">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow column for the guest finder on phones, a wrapping grid of table cards below. Burgundy + olive green, gold foil accents. */
:root{
  --bg:#637545;        /* olive green */
  --surface:#55663a;
  --line:#7d8e5e;
  --ink:#f6f1e6;       /* ivory card stock */
  --muted:#e4dfcb;
  --gold:#ecd7a4;      /* invitation foil */
  --gold-ink:#1f1a10;
  --wine:#7a2f36;      /* calm burgundy */
  --wine-deep:#7a2f36;
  --wine-ink:#f7efe7;
  --warn:#e3a35b;
  --display:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --body:"Jost", "Helvetica Neue", Arial, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:40px 20px 56px;display:flex;flex-direction:column;gap:36px}

/* Hero */
.hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.eyebrow{margin:0;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
h1{margin:0;font-family:var(--display);font-weight:500;font-size:clamp(40px,8vw,64px);line-height:1.05;text-wrap:balance}
h1 .amp{font-style:italic;color:var(--gold)}
.date{margin:4px 0 0;color:var(--muted)}
.rule{display:flex;align-items:center;gap:10px;width:160px;margin-top:10px;color:var(--gold)}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:currentColor;opacity:.6}
.rule span{width:6px;height:6px;transform:rotate(45deg);border:1px solid currentColor}
.sample-pill{display:inline-block;margin-top:10px;padding:3px 10px;border:1px solid var(--warn);color:var(--warn);border-radius:999px;font-size:12px;letter-spacing:.04em}

/* Finder */
.finder{max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.finder label{font-family:var(--display);font-size:26px;text-align:center}
.search{width:100%;padding:16px 18px;border-radius:12px;border:1px solid var(--gold);background:var(--surface);font-size:18px}
.search::placeholder{color:var(--muted)}
.results{display:flex;flex-direction:column;gap:10px}
.result{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 16px;padding:16px 18px;border-radius:12px;background:var(--wine);color:var(--wine-ink);border:1px solid var(--gold)}
.r-name{font-weight:600;font-size:18px}
.r-label{grid-column:1;font-size:13px;opacity:.8}
.r-table{color:var(--gold);grid-column:2;grid-row:1 / span 2;font-family:var(--display);font-weight:600;font-size:28px;text-align:right;line-height:1.1}
.nomatch{margin:0;padding:14px 16px;border-radius:12px;border:1px dashed var(--line);color:var(--muted);text-align:center}

/* Tables grid */
.section-h{margin:0 0 14px;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.card.hit{background:var(--wine);border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.card h3{margin:0;font-family:var(--display);font-weight:600;font-size:24px;line-height:1.15}
.count{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.names{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.names li{padding:2px 0}
.names li.me{color:var(--gold);font-weight:600}
.empty{color:var(--muted);font-style:italic}
footer{display:flex;justify-content:center}
.linkish{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px}

@media (max-width:420px){.wrap{padding:28px 16px 48px}.r-table{font-size:24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.loading{color:var(--muted);text-align:center}
.dir{columns:3 280px;column-gap:28px}
.letter{break-inside:avoid;margin:0 0 18px}
.letter h3{margin:0 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line);font-family:var(--display);font-weight:600;font-size:26px;color:var(--gold);line-height:1.1}
.letter ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.letter li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:6px 10px;border-radius:8px}
.letter li:nth-child(even){background:rgba(0,0,0,.06)}
.dn{min-width:0}
.dt{color:var(--gold);white-space:nowrap;font-size:14px;font-variant-numeric:tabular-nums}
.letter li.me{background:var(--wine);box-shadow:0 0 0 1px var(--gold)}
.letter li.me .dn{font-weight:600}
.plan{width:100%;height:auto;display:block}
.plan .room{fill:rgba(0,0,0,.12);stroke:var(--gold);stroke-width:.15}
.plan .gridl{stroke:rgba(255,255,255,.08);stroke-width:.06}
.plan .tb{fill:var(--ink);stroke:var(--gold);stroke-width:.12}
.plan .seat{fill:var(--gold);opacity:.85}
.plan .tl{fill:#3a4426;font-family:var(--display);font-weight:600;text-anchor:middle;pointer-events:none}
.plan .hi .tb{fill:var(--wine)}
.plan .hi .tl{fill:var(--ink)}
.plan .feat rect{fill:rgba(255,255,255,.07);stroke:var(--gold);stroke-width:.12;stroke-dasharray:.5 .4}
.plan .fl{fill:var(--ink);font-style:italic;text-anchor:middle;font-family:var(--body);pointer-events:none}
.plan-wrap{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.plan-guest .plan-wrap{padding:10px}
.plan-hint{margin:8px 0 0;color:var(--muted);font-size:13px;text-align:center}
</style>
</head>
<body>
<div id="app"><main class="wrap"><p class="loading">Loading seating chart…</p></main></div>
<script>
(function(){
  "use strict";
  var app=document.getElementById("app"), data=null, query="";
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function norm(s){return String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim();}
  function findMatches(q){
    var nq=norm(q); if(nq.length<2) return [];
    var qt=nq.split(" "), out=[];
    data.tables.forEach(function(t,ti){ t.guests.forEach(function(g){
      var ng=norm(g), gt=ng.split(" ");
      if(ng.indexOf(nq)!==-1 || qt.every(function(x){return gt.some(function(y){return y.indexOf(x)===0;});})) out.push({name:g,table:t,ti:ti});
    });});
    return out.slice(0,8);
  }
  function render(){
    var e=data.event;
    document.title="Find Your Seat · "+e.title;
    app.innerHTML='<main class="wrap"><header class="hero"><p class="eyebrow">'+esc(e.subtitle)+'</p><h1>'+esc(e.title).replace("&amp;",'<span class="amp">&amp;</span>')+'</h1><p class="date">'+esc(e.date)+(e.place?' · '+esc(e.place):'')+'</p><div class="rule" aria-hidden="true"><span></span></div>'+(data.example?'<span class="sample-pill">Preview with sample names</span>':'')+'</header>'+
      '<section class="finder"><label for="q">Find your seat</label><input id="q" class="search" type="search" placeholder="Type your first or last name" autocomplete="off" autocapitalize="words" enterkeyhint="search"><div id="results" class="results" aria-live="polite"></div></section>'+
      (data.showPlan?'<section aria-labelledby="plan-h" class="plan-guest"><h2 id="plan-h" class="section-h">Floor plan</h2><div class="plan-wrap"><div id="plan"></div></div><p class="plan-hint">Search your name above and your table lights up.</p></section>':'')+
      '<section aria-labelledby="all-h"><h2 id="all-h" class="section-h">All guests · A to Z by last name</h2><div id="grid" class="dir"></div></section></main>';
    var q=document.getElementById("q");
    q.addEventListener("input",function(){query=q.value;update();});
    update();
  }
  function update(){
    var m=findMatches(query), ht={}, hn={};
    m.forEach(function(x){ht[x.ti]=1;hn[x.ti+"|"+x.name]=1;});
    var res="";
    if(norm(query).length>=2) res=m.length?m.map(function(x){return '<div class="result"><span class="r-name">'+esc(x.name)+'</span><span class="r-label">is seated at</span><span class="r-table">'+esc(x.table.name)+'</span></div>';}).join(""):'<p class="nomatch">No match for “'+esc(query)+'”. Try your last name, or ask one of the hosts.</p>';
    document.getElementById("results").innerHTML=res;
    var pl=document.getElementById("plan");
    if(pl){ var hi={}; m.forEach(function(x){hi["i:"+x.ti]=1;}); pl.innerHTML=planSVG(data,{keyOf:function(t,i){return "i:"+i;},hi:hi}); }
    var all=[];
    data.tables.forEach(function(t,ti){ t.guests.forEach(function(g){ all.push({name:g,table:t.name,ti:ti,key:lastKey(g)}); }); });
    all.sort(function(a,b){ return a.key.localeCompare(b.key)||norm(a.name).localeCompare(norm(b.name)); });
    var groups=[], cur=null;
    all.forEach(function(x){ var L=(x.key.charAt(0)||"#").toUpperCase(); if(!/[A-Z]/.test(L)) L="#"; if(!cur||cur.L!==L){ cur={L:L,items:[]}; groups.push(cur); } cur.items.push(x); });
    document.getElementById("grid").innerHTML=groups.map(function(g){
      return '<section class="letter"><h3>'+g.L+'</h3><ul>'+g.items.map(function(x){
        return '<li'+(hn[x.ti+"|"+x.name]?' class="me"':'')+'><span class="dn">'+esc(x.name)+'</span><span class="dt">'+esc(x.table)+'</span></li>';
      }).join("")+'</ul></section>';
    }).join("")||'<p class="empty">No guests yet</p>';
  }
  /* ---------- Floor plan (shared) ---------- */
  function isRect(t){ return t.shape ? t.shape==="rect" : (/head/i.test(t.name||"") || (Number(t.seats)||0)>=16); }
  function tableDims(t){
    var n=Math.max(1,Number(t.seats)||8);
    if(isRect(t)) return [Math.max(8,Math.ceil(n/2)*2),3.5];
    var d=n<=8?5:(n<=10?6:(n<=12?7:8)); return [d,d];
  }
  function ensureLayout(d){
    d.room=d.room||{width:60,length:40};
    var W=Number(d.room.width)||60, L=Number(d.room.length)||40;
    var missing=d.tables.filter(function(t){return typeof t.x!=="number"||typeof t.y!=="number";});
    if(missing.length&&missing.length===d.tables.length){
      var heads=d.tables.filter(isRect), rounds=d.tables.filter(function(t){return !isRect(t);});
      var total=heads.reduce(function(s,t){return s+tableDims(t)[0];},0)+Math.max(0,heads.length-1)*3;
      var x=Math.max(1,(W-total)/2);
      heads.forEach(function(t){var w=tableDims(t)[0]; t.x=Math.min(W,x+w/2); t.y=4; t.rot=0; x+=w+3;});
      var cols=Math.max(1,Math.floor((W-4)/9)), startX=(W-(cols-1)*9)/2;
      rounds.forEach(function(t,i){ t.x=startX+(i%cols)*9; t.y=Math.min(L,13+Math.floor(i/cols)*9); t.rot=0; });
    } else {
      missing.forEach(function(t,k){ t.x=Math.min(W,W/2+k*2); t.y=Math.min(L,L/2+k*2); t.rot=0; });
    }
    if(!d.features) d.features=[{id:"f1",label:"Dance floor",x:W/2,y:Math.max(6,L-8),w:16,h:12,rot:0},{id:"f2",label:"Entrance",x:W/2,y:L-0.6,w:6,h:1,rot:0}];
    keepInRoom(d);
  }
  function keepInRoom(d){
    var W=Number(d.room.width)||60, L=Number(d.room.length)||40;
    function clamp(o,w,h){ var hw=Math.min(w/2,W/2), hh=Math.min(h/2,L/2);
      o.x=Math.max(hw,Math.min(W-hw,Number(o.x)||0)); o.y=Math.max(hh,Math.min(L-hh,Number(o.y)||0)); }
    d.tables.forEach(function(t){ var dm=tableDims(t), pad=isRect(t)?1.3:1.3, w=dm[0]+(isRect(t)?0:pad*2), h=dm[1]+pad*2; if(t.rot){ var tmp=w; w=h; h=tmp; } clamp(t,w,h); });
    (d.features||[]).forEach(function(f){ clamp(f,f.rot?f.h:f.w,f.rot?f.w:f.h); });
  }
  function planSVG(d,o){
    var W=Number(d.room.width)||60, L=Number(d.room.length)||40, h=[];
    h.push('<svg class="plan" viewBox="-2 -2 '+(W+4)+' '+(L+4)+'" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Floor plan of the room">');
    h.push('<rect class="room" x="0" y="0" width="'+W+'" height="'+L+'" rx="0.4"/>');
    for(var gx=5;gx<W;gx+=5) h.push('<line class="gridl" x1="'+gx+'" y1="0" x2="'+gx+'" y2="'+L+'"/>');
    for(var gy=5;gy<L;gy+=5) h.push('<line class="gridl" x1="0" y1="'+gy+'" x2="'+W+'" y2="'+gy+'"/>');
    (d.features||[]).forEach(function(f){
      var k="f:"+f.id, rw=f.rot?f.h:f.w, rh=f.rot?f.w:f.h, fs=Math.min(1.2,Math.max(0.6,Math.min(rw,rh)*0.45));
      h.push('<g class="pi feat'+(o.sel===k?' sel':'')+'" data-k="'+esc(k)+'" transform="translate('+f.x+' '+f.y+')"><rect x="'+(-rw/2)+'" y="'+(-rh/2)+'" width="'+rw+'" height="'+rh+'" rx="0.3"/><text class="fl" y="'+(fs*0.35)+'" font-size="'+fs+'">'+esc(f.label)+'</text></g>');
    });
    d.tables.forEach(function(t,i){
      var k=o.keyOf(t,i), dm=tableDims(t), n=Number(t.seats)||0, rect=isRect(t), seats="", shape, label, fs, inner;
      if(rect){
        var w=dm[0], hh=dm[1], per=Math.max(1,Math.ceil(n/2)), sp=w/per;
        shape='<rect class="tb" x="'+(-w/2)+'" y="'+(-hh/2)+'" width="'+w+'" height="'+hh+'" rx="0.4"/>';
        for(var s=0;s<n;s++){ var side=s<per?-1:1, idx=s<per?s:s-per; seats+='<circle class="seat" cx="'+(-w/2+sp*(idx+0.5)).toFixed(2)+'" cy="'+(side*(hh/2+0.75))+'" r="0.5"/>'; }
        label=t.name; fs=1.5;
        inner='<g transform="rotate('+(t.rot||0)+')">'+seats+shape+'<text class="tl" y="'+(fs*0.35)+'" font-size="'+fs+'">'+esc(label)+'</text></g>';
      } else {
        var r=dm[0]/2; shape='<circle class="tb" r="'+r+'"/>';
        for(var s2=0;s2<n;s2++){ var a=2*Math.PI*s2/n-Math.PI/2; seats+='<circle class="seat" cx="'+((r+0.8)*Math.cos(a)).toFixed(2)+'" cy="'+((r+0.8)*Math.sin(a)).toFixed(2)+'" r="0.5"/>'; }
        label=(t.name||"").replace(/^table\s*/i,""); fs=label.length>3?Math.min(1.3,dm[0]*1.6/Math.max(4,label.length)):2.2;
        inner=seats+shape+'<text class="tl" y="'+(fs*0.35)+'" font-size="'+fs+'">'+esc(label)+'</text>';
      }
      h.push('<g class="pi tbl'+(o.hi&&o.hi[k]?' hi':'')+(o.sel===k?' sel':'')+'" data-k="'+esc(k)+'" transform="translate('+t.x+' '+t.y+')"><title>'+esc(t.name)+'</title>'+inner+'</g>');
    });
    h.push('</svg>');
    return h.join("");
  }
  function lastKey(n){ var p=norm(n).split(" "); return p[p.length-1]||""; }
  fetch("seating.json",{cache:"no-cache"}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(d){data=d;ensureLayout(data);render();})
    .catch(function(){app.innerHTML='<main class="wrap"><p class="loading">The seating chart couldn’t load. Check your connection and refresh, or ask one of the hosts.</p></main>';});
})();
</script>
</body>
</html>
