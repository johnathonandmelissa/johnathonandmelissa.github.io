<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#637545">
<title>Seating Admin · Johnathon &amp; Melissa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow column for the guest finder on phones, a wrapping grid of table cards below. Burgundy + olive green, gold foil accents. */
:root{
  --bg:#637545;        /* olive green */
  --surface:#55663a;
  --line:#7d8e5e;
  --ink:#f6f1e6;       /* ivory card stock */
  --muted:#e4dfcb;
  --gold:#ecd7a4;      /* invitation foil */
  --gold-ink:#1f1a10;
  --wine:#7a2f36;      /* calm burgundy */
  --wine-deep:#7a2f36;
  --wine-ink:#f7efe7;
  --warn:#e3a35b;
  --display:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --body:"Jost", "Helvetica Neue", Arial, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:40px 20px 56px;display:flex;flex-direction:column;gap:36px}

/* Hero */
.hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.eyebrow{margin:0;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
h1{margin:0;font-family:var(--display);font-weight:500;font-size:clamp(40px,8vw,64px);line-height:1.05;text-wrap:balance}
h1 .amp{font-style:italic;color:var(--gold)}
.date{margin:4px 0 0;color:var(--muted)}
.rule{display:flex;align-items:center;gap:10px;width:160px;margin-top:10px;color:var(--gold)}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:currentColor;opacity:.6}
.rule span{width:6px;height:6px;transform:rotate(45deg);border:1px solid currentColor}
.sample-pill{display:inline-block;margin-top:10px;padding:3px 10px;border:1px solid var(--warn);color:var(--warn);border-radius:999px;font-size:12px;letter-spacing:.04em}

/* Finder */
.finder{max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.finder label{font-family:var(--display);font-size:26px;text-align:center}
.search{width:100%;padding:16px 18px;border-radius:12px;border:1px solid var(--gold);background:var(--surface);font-size:18px}
.search::placeholder{color:var(--muted)}
.results{display:flex;flex-direction:column;gap:10px}
.result{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 16px;padding:16px 18px;border-radius:12px;background:var(--wine);color:var(--wine-ink);border:1px solid var(--gold)}
.r-name{font-weight:600;font-size:18px}
.r-label{grid-column:1;font-size:13px;opacity:.8}
.r-table{color:var(--gold);grid-column:2;grid-row:1 / span 2;font-family:var(--display);font-weight:600;font-size:28px;text-align:right;line-height:1.1}
.nomatch{margin:0;padding:14px 16px;border-radius:12px;border:1px dashed var(--line);color:var(--muted);text-align:center}

/* Tables grid */
.section-h{margin:0 0 14px;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.card.hit{background:var(--wine);border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.card h3{margin:0;font-family:var(--display);font-weight:600;font-size:24px;line-height:1.15}
.count{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.names{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.names li{padding:2px 0}
.names li.me{color:var(--gold);font-weight:600}
.empty{color:var(--muted);font-style:italic}
footer{display:flex;justify-content:center}
.linkish{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px}

/* Host mode */
.hostbar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 20px}
.hostbar-in{max-width:1080px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.hostbar strong{font-family:var(--display);font-size:22px;font-weight:600}
.stats{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.spacer{flex:1}
.btn{padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px;font-weight:500}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--wine);color:var(--wine-ink);border-color:var(--gold)}
.btn.primary[disabled]{cursor:default;background:var(--surface);color:var(--ink);border-color:var(--line);opacity:.8}
.input::placeholder,.search::placeholder{color:var(--ink);opacity:.7}
.btn.small{padding:5px 10px;font-size:13px}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--warn);color:var(--warn)}
.notice{padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.notice.warn{border-color:var(--warn)}
.notice.ok{border-color:var(--gold)}
.event-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);letter-spacing:.04em}
.input{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-size:15px;color:var(--ink)}
.card.host .card-head{align-items:center}
.t-name{font-family:var(--display);font-size:22px;font-weight:600;padding:4px 8px;background:transparent;border:1px solid transparent;border-radius:8px;min-width:0;flex:1}
.t-name:hover,.t-name:focus{border-color:var(--line);background:var(--bg)}
.cap{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.cap.over{border-color:var(--warn);color:var(--warn)}
.seats-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.seats-row input{width:64px;padding:5px 8px}
.hnames{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.hnames li{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:6px;padding:3px 0;border-bottom:1px solid var(--line)}
.hnames li:last-child{border-bottom:0}
.hnames select{max-width:118px;padding:3px 6px;font-size:12px;border-radius:7px;border:1px solid var(--line);background:var(--bg)}
.x{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:transparent;cursor:pointer;color:var(--muted);line-height:1}
.x:hover{color:var(--ink);border-color:var(--warn)}
.add{display:flex;gap:6px}
.add .input{padding:7px 10px;font-size:14px}
.card.pool{border-style:dashed}
.addtable{min-height:120px;border:1px dashed var(--line);border-radius:14px;background:transparent;cursor:pointer;color:var(--muted);font-size:15px}
.addtable:hover{border-color:var(--gold);color:var(--ink)}
.import{display:flex;flex-direction:column;gap:10px}
.import textarea{min-height:180px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.hint{margin:0;color:var(--muted);font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px}
@media (max-width:420px){.wrap{padding:28px 16px 48px}.r-table{font-size:24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.login{max-width:460px;margin:8vh auto 0;display:flex;flex-direction:column;gap:14px}
.login h1{font-size:40px;text-align:center}
.login ol{margin:0;padding-left:20px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:4px}
.login a,.hostbar a{color:var(--gold)}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.g-name{width:100%;min-width:0;padding:4px 6px;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--ink);font-size:15px}
.g-name:hover,.g-name:focus{border-color:var(--line);background:var(--bg)}
.order{display:flex;gap:2px}
.o{width:24px;height:26px;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;line-height:1;font-size:13px;padding:0}
.o:hover:not([disabled]){border-color:var(--gold)}
.o[disabled]{opacity:.3;cursor:default}
.wrap > .grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr))}
.hnames select{max-width:110px}
.drag{cursor:grab;color:var(--muted);font-size:18px;line-height:1;padding:4px 2px;user-select:none;touch-action:none}
.drag:active{cursor:grabbing}
.hnames{min-height:40px}
.hnames:empty{border:1px dashed var(--line);border-radius:9px;display:flex;align-items:center;justify-content:center}
.hnames:empty::before{content:"No guests yet. Drag someone here.";color:var(--muted);font-style:italic;font-size:14px}
.drag-ghost{opacity:.35}
.drag-chosen{background:var(--wine);border-radius:8px}
.sortable-fallback{background:var(--wine);border-radius:8px;opacity:.95}
.plan{width:100%;height:auto;display:block}
.plan .room{fill:rgba(0,0,0,.12);stroke:var(--gold);stroke-width:.15}
.plan .gridl{stroke:rgba(255,255,255,.08);stroke-width:.06}
.plan .tb{fill:var(--ink);stroke:var(--gold);stroke-width:.12}
.plan .seat{fill:var(--gold);opacity:.85}
.plan .tl{fill:#3a4426;font-family:var(--display);font-weight:600;text-anchor:middle;pointer-events:none}
.plan .hi .tb{fill:var(--wine)}
.plan .hi .tl{fill:var(--ink)}
.plan .feat rect{fill:rgba(255,255,255,.07);stroke:var(--gold);stroke-width:.12;stroke-dasharray:.5 .4}
.plan .fl{fill:var(--ink);font-style:italic;text-anchor:middle;font-family:var(--body);pointer-events:none}
.plan-wrap{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.plan .pi{cursor:grab}
.plan .sel .tb,.plan .sel rect{stroke:#fff;stroke-width:.35}
.plan-tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.plan-tools .input{width:76px;padding:6px 8px}
.plan-sel{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:38px;padding:6px 10px;border-radius:10px;background:var(--bg);font-size:14px}
.plan-sel .input{width:76px;padding:5px 8px}
.plan-sel .lbl{width:160px}
.btn.on{background:var(--wine);color:var(--wine-ink);border-color:var(--gold)}
.plan .ratio{fill:#3a4426;opacity:.75;font-family:var(--body);font-weight:500}
.plan .ratio.over{fill:#7a2f36;opacity:1;font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script>
(function(){
  "use strict";
  var OWNER="johnathonandmelissa", REPO="johnathonandmelissa.github.io", PATH="seating.json", BRANCH="main";
  var API="https://api.github.com/repos/"+OWNER+"/"+REPO+"/contents/"+PATH;
  var TOKEN_KEY="seating-admin-token";
  var app=document.getElementById("app");
  var token=null, sha=null, saved=null, draft=null, dirty=false, status=null, importOpen=false, saving=false, view="tables", selected=null;
  var FEAT_SIZES={"Dance floor":[16,16],"DJ":[8,4],"Bar":[12,3],"Entrance":[6,1],"Buffet":[16,3],"Cake":[4,4]};

  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function uid(){return "t"+Math.random().toString(36).slice(2,9);}
  function clone(o){return JSON.parse(JSON.stringify(o));}
  function splitNames(s){return String(s).split(",").map(function(x){return x.trim();}).filter(Boolean);}
  function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  function lsSet(k,v){try{if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){}}
  function b64decode(b){var bin=atob(b.replace(/\s/g,"")),bytes=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder().decode(bytes);}
  function b64encode(str){var bytes=new TextEncoder().encode(str),bin="";for(var i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);return btoa(bin);}

  function gh(method,body){
    return fetch(API+(method==="GET"?"?ref="+BRANCH+"&t="+Date.now():""),{method:method,headers:{"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},body:body?JSON.stringify(body):undefined,cache:"no-store"})
      .then(function(r){return r.json().catch(function(){return {};}).then(function(j){if(!r.ok){var e=new Error(j.message||("HTTP "+r.status));e.status=r.status;throw e;}return j;});});
  }
  function normalize(d){
    d.event=d.event||{title:"",subtitle:"",date:"",place:""};
    d.tables=(d.tables||[]).map(function(t){var o={id:t.id||uid(),name:t.name||"Table",seats:Number(t.seats)||8,guests:(t.guests||[]).slice()};
      if(typeof t.x==="number") o.x=t.x; if(typeof t.y==="number") o.y=t.y; o.rot=t.rot||0; if(t.shape) o.shape=t.shape; return o;});
    if(d.features) d.features=d.features.map(function(f){f.id=f.id||uid(); f.rot=f.rot||0; return f;});
    d.unseated=(d.unseated||[]).slice();
    return d;
  }

  /* ---------- Sign-in ---------- */
  function renderLogin(err){
    app.innerHTML='<main class="wrap"><section class="login">'+
      '<p class="eyebrow" style="text-align:center">Seating admin</p><h1>Edit the seating chart</h1>'+
      (err?'<div class="notice warn" role="alert">'+esc(err)+'</div>':'')+
      '<label class="field" for="tok">GitHub access token<input id="tok" class="input" type="password" autocomplete="off" placeholder="github_pat_…"></label>'+
      '<label class="check" for="rem"><input id="rem" type="checkbox" checked> Remember on this device</label>'+
      '<button type="button" class="btn primary" data-act="login">Open editor</button>'+
      '<div class="notice"><b>First time?</b> Create a token once:<ol>'+
      '<li>Open <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com/settings/personal-access-tokens/new</a></li>'+
      '<li>Resource owner: <b>johnathonandmelissa</b></li>'+
      '<li>Repository access: <b>Only select repositories</b> → <b>johnathonandmelissa.github.io</b></li>'+
      '<li>Permissions → Repository → <b>Contents: Read and write</b></li>'+
      '<li>Generate, copy it, and paste it above</li></ol></div>'+
      '<p class="hint" style="text-align:center"><a href="./">View guest page</a></p>'+
    '</section></main>';
    var t=document.getElementById("tok"); t.focus();
    t.addEventListener("keydown",function(e){if(e.key==="Enter")login();});
  }
  function login(){
    var v=document.getElementById("tok").value.trim(); if(!v) return;
    token=v; if(document.getElementById("rem").checked) lsSet(TOKEN_KEY,v);
    load();
  }
  function load(msg){
    app.innerHTML='<main class="wrap"><p class="loading">Loading seating…</p></main>';
    gh("GET").then(function(j){
      sha=j.sha; saved=normalize(JSON.parse(b64decode(j.content)));
      draft=clone(saved); dirty=false; status=msg||null; importOpen=false; render();
    }).catch(function(e){
      if(e.status===401||e.status===403||e.status===404){lsSet(TOKEN_KEY,null);token=null;renderLogin("That token can't open the seating file ("+e.message+"). Check it was made for johnathonandmelissa.github.io with Contents: Read and write.");}
      else renderLogin("Couldn't load the seating ("+e.message+"). Check your connection and try again.");
    });
  }

  /* ---------- Editor ---------- */
  function listFor(id){ if(id==="__unseated") return draft.unseated; var t=draft.tables.find(function(x){return x.id===id;}); return t?t.guests:null; }
  function tableOptions(cur){
    return draft.tables.map(function(t){return '<option value="'+esc(t.id)+'"'+(t.id===cur?' selected':'')+'>'+esc(t.name)+'</option>';}).join("")+
      '<option value="__unseated"'+(cur==="__unseated"?' selected':'')+'>Not seated</option>';
  }
  function guestRows(id,list){
    return '<ul class="hnames" data-t="'+esc(id)+'">'+list.map(function(g,i){
      return '<li><span class="drag" title="Drag to move" aria-hidden="true">⠿</span>'+
        '<input id="gname-'+esc(id)+'-'+i+'" class="g-name" data-t="'+esc(id)+'" data-g="'+i+'" value="'+esc(g)+'" aria-label="Guest name" autocomplete="off">'+
        '<select class="g-move" data-t="'+esc(id)+'" data-g="'+i+'" aria-label="Move '+esc(g)+' to another table">'+tableOptions(id)+'</select>'+
        '<button type="button" class="x" data-act="del-guest" data-t="'+esc(id)+'" data-g="'+i+'" aria-label="Remove '+esc(g)+'">×</button></li>';
    }).join("")+'</ul>';
  }
  function initDrag(){
    if(!window.Sortable) return;
    document.querySelectorAll("ul.hnames").forEach(function(ul){
      Sortable.create(ul,{group:"guests",handle:".drag",animation:150,forceFallback:true,fallbackOnBody:true,fallbackTolerance:3,ghostClass:"drag-ghost",chosenClass:"drag-chosen",emptyInsertThreshold:24,
        onEnd:function(evt){
          var from=listFor(evt.from.getAttribute("data-t")), to=listFor(evt.to.getAttribute("data-t"));
          if(!from||!to||(from===to&&evt.oldIndex===evt.newIndex)) return;
          var item=from.splice(evt.oldIndex,1)[0]; to.splice(evt.newIndex,0,item); changed();
        }});
    });
  }
  function addForm(id){ return '<form class="add" data-t="'+esc(id)+'"><input id="add-'+esc(id)+'" class="input" placeholder="Add guest (commas for several)" autocomplete="off"><button class="btn small" type="submit">Add</button></form>'; }
  function toText(d){ var l=d.tables.map(function(t){return t.name+": "+t.guests.join(", ");}); if(d.unseated.length) l.push(d.unseated.join(", ")); return l.join("\n"); }

  /* ---------- Floor plan (shared) ---------- */
  function isRect(t){ return t.shape ? t.shape==="rect" : (/head/i.test(t.name||"") || (Number(t.seats)||0)>=16); }
  function tableDims(t){
    var n=Math.max(1,Number(t.seats)||8);
    if(isRect(t)) return [Math.max(8,Math.ceil(n/2)*2),3.5];
    var d=n<=8?5:(n<=10?6:(n<=12?7:8)); return [d,d];
  }
  function ensureLayout(d){
    d.room=d.room||{width:60,length:40};
    var W=Number(d.room.width)||60, L=Number(d.room.length)||40;
    var missing=d.tables.filter(function(t){return typeof t.x!=="number"||typeof t.y!=="number";});
    if(missing.length&&missing.length===d.tables.length){
      var heads=d.tables.filter(isRect), rounds=d.tables.filter(function(t){return !isRect(t);});
      var total=heads.reduce(function(s,t){return s+tableDims(t)[0];},0)+Math.max(0,heads.length-1)*3;
      var x=Math.max(1,(W-total)/2);
      heads.forEach(function(t){var w=tableDims(t)[0]; t.x=Math.min(W,x+w/2); t.y=4; t.rot=0; x+=w+3;});
      var cols=Math.max(1,Math.floor((W-4)/9)), startX=(W-(cols-1)*9)/2;
      rounds.forEach(function(t,i){ t.x=startX+(i%cols)*9; t.y=Math.min(L,13+Math.floor(i/cols)*9); t.rot=0; });
    } else {
      missing.forEach(function(t,k){ t.x=Math.min(W,W/2+k*2); t.y=Math.min(L,L/2+k*2); t.rot=0; });
    }
    if(!d.features) d.features=[{id:"f1",label:"Dance floor",x:W/2,y:Math.max(6,L-8),w:16,h:12,rot:0},{id:"f2",label:"Entrance",x:W/2,y:L-0.6,w:6,h:1,rot:0}];
    keepInRoom(d);
  }
  function keepInRoom(d){
    var W=Number(d.room.width)||60, L=Number(d.room.length)||40;
    function clamp(o,w,h){ var hw=Math.min(w/2,W/2), hh=Math.min(h/2,L/2);
      o.x=Math.max(hw,Math.min(W-hw,Number(o.x)||0)); o.y=Math.max(hh,Math.min(L-hh,Number(o.y)||0)); }
    d.tables.forEach(function(t){ var dm=tableDims(t), pad=isRect(t)?1.3:1.3, w=dm[0]+(isRect(t)?0:pad*2), h=dm[1]+pad*2; if(t.rot){ var tmp=w; w=h; h=tmp; } clamp(t,w,h); });
    (d.features||[]).forEach(function(f){ clamp(f,f.rot?f.h:f.w,f.rot?f.w:f.h); });
  }
  function planSVG(d,o){
    var W=Number(d.room.width)||60, L=Number(d.room.length)||40, h=[];
    h.push('<svg class="plan" viewBox="-2 -2 '+(W+4)+' '+(L+4)+'" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Floor plan of the room">');
    h.push('<rect class="room" x="0" y="0" width="'+W+'" height="'+L+'" rx="0.4"/>');
    for(var gx=5;gx<W;gx+=5) h.push('<line class="gridl" x1="'+gx+'" y1="0" x2="'+gx+'" y2="'+L+'"/>');
    for(var gy=5;gy<L;gy+=5) h.push('<line class="gridl" x1="0" y1="'+gy+'" x2="'+W+'" y2="'+gy+'"/>');
    (d.features||[]).forEach(function(f){
      var k="f:"+f.id, rw=f.rot?f.h:f.w, rh=f.rot?f.w:f.h, fs=Math.min(1.2,Math.max(0.6,Math.min(rw,rh)*0.45));
      h.push('<g class="pi feat'+(o.sel===k?' sel':'')+'" data-k="'+esc(k)+'" transform="translate('+f.x+' '+f.y+')"><rect x="'+(-rw/2)+'" y="'+(-rh/2)+'" width="'+rw+'" height="'+rh+'" rx="0.3"/><text class="fl" y="'+(fs*0.35)+'" font-size="'+fs+'">'+esc(f.label)+'</text></g>');
    });
    d.tables.forEach(function(t,i){
      var k=o.keyOf(t,i), dm=tableDims(t), n=Number(t.seats)||0, rect=isRect(t), seats="", shape, label, fs, inner;
      var gc=(t.guests||[]).length, over=gc>n;
      if(rect){
        var w=dm[0], hh=dm[1], per=Math.max(1,Math.ceil(n/2)), sp=w/per;
        shape='<rect class="tb" x="'+(-w/2)+'" y="'+(-hh/2)+'" width="'+w+'" height="'+hh+'" rx="0.4"/>';
        for(var s=0;s<n;s++){ var side=s<per?-1:1, idx=s<per?s:s-per; seats+='<circle class="seat" cx="'+(-w/2+sp*(idx+0.5)).toFixed(2)+'" cy="'+(side*(hh/2+0.75))+'" r="0.5"/>'; }
        label=t.name; fs=1.5;
        var rr=o.counts?'<tspan class="ratio'+(over?' over':'')+'" font-size="1.1" dx="0.8">'+gc+'/'+n+'</tspan>':'';
        inner='<g transform="rotate('+(t.rot||0)+')">'+seats+shape+'<text class="tl" y="'+(fs*0.35)+'" font-size="'+fs+'">'+esc(label)+rr+'</text></g>';
      } else {
        var r=dm[0]/2; shape='<circle class="tb" r="'+r+'"/>';
        for(var s2=0;s2<n;s2++){ var a=2*Math.PI*s2/n-Math.PI/2; seats+='<circle class="seat" cx="'+((r+0.8)*Math.cos(a)).toFixed(2)+'" cy="'+((r+0.8)*Math.sin(a)).toFixed(2)+'" r="0.5"/>'; }
        label=(t.name||"").replace(/^table\s*/i,""); fs=label.length>3?Math.min(1.3,dm[0]*1.6/Math.max(4,label.length)):2.2;
        if(o.counts){ inner=seats+shape+'<text class="tl" y="'+(fs*0.35-0.55)+'" font-size="'+fs+'">'+esc(label)+'</text>'+
            '<text class="tl ratio'+(over?' over':'')+'" y="1.55" font-size="1">'+gc+'/'+n+'</text>'; }
        else inner=seats+shape+'<text class="tl" y="'+(fs*0.35)+'" font-size="'+fs+'">'+esc(label)+'</text>';
      }
      h.push('<g class="pi tbl'+(o.hi&&o.hi[k]?' hi':'')+(o.sel===k?' sel':'')+'" data-k="'+esc(k)+'" transform="translate('+t.x+' '+t.y+')"><title>'+esc(t.name)+'</title>'+inner+'</g>');
    });
    h.push('</svg>');
    return h.join("");
  }

  function objFor(k){ if(!k) return null; var id=k.slice(2);
    if(k.charAt(0)==="t") return draft.tables.find(function(t){return t.id===id;})||null;
    return (draft.features||[]).find(function(f){return f.id===id;})||null; }
  function planSection(){
    ensureLayout(draft);
    var r=draft.room, k=selected, o=objFor(k), sel;
    if(!o){ selected=null; sel='<span class="hint">Drag tables and room items to move them. Click one to rotate, resize or remove it.</span>'; }
    else if(k.charAt(0)==="t"){
      sel='<b>'+esc(o.name)+'</b><span>'+o.guests.length+' guests · '+o.seats+' seats</span><span class="spacer"></span>'+
        '<button type="button" class="btn small" data-act="p-rotate">Rotate</button>'+
        '<button type="button" class="btn small" data-act="p-shape">'+(isRect(o)?'Make round':'Make rectangular')+'</button>'+
        '<button type="button" class="btn small" data-act="p-done">Done</button>';
    } else {
      sel='<label for="f-lbl">Label</label><input id="f-lbl" class="input lbl f-edit" data-k="label" value="'+esc(o.label)+'">'+
        '<label for="f-w">Size</label><input id="f-w" class="input f-edit" data-k="w" type="number" min="1" max="200" step="0.5" value="'+o.w+'"> × '+
        '<input id="f-h" class="input f-edit" data-k="h" type="number" min="1" max="200" step="0.5" value="'+o.h+'" aria-label="Length"> ft<span class="spacer"></span>'+
        '<button type="button" class="btn small" data-act="p-rotate">Rotate</button>'+
        '<button type="button" class="btn small" data-act="p-remove">Remove</button>'+
        '<button type="button" class="btn small" data-act="p-done">Done</button>';
    }
    return '<section class="plan-wrap">'+
      '<div class="plan-tools"><label for="room-w">Room</label><input id="room-w" class="input rm" data-k="width" type="number" min="10" max="400" value="'+esc(r.width)+'"> ft wide ×'+
      '<input id="room-l" class="input rm" data-k="length" type="number" min="10" max="400" value="'+esc(r.length)+'" aria-label="Room length"> ft long<span class="spacer"></span>'+
      '<label class="check" for="showplan"><input id="showplan" type="checkbox"'+(draft.showPlan?' checked':'')+'> Show floor plan to guests</label></div>'+
      '<div class="plan-tools">Add:'+Object.keys(FEAT_SIZES).map(function(n){return '<button type="button" class="btn small" data-act="p-add" data-label="'+esc(n)+'">'+esc(n)+'</button>';}).join("")+
      '<input id="feat-label" class="input" style="width:140px" placeholder="Other item"><button type="button" class="btn small" data-act="p-add-custom">Add</button></div>'+
      '<div class="plan-sel">'+sel+'</div>'+
      '<div id="plan-host">'+planSVG(draft,{keyOf:function(t){return "t:"+t.id;},sel:selected,counts:true})+'</div>'+
      '<p class="hint">Each grid square is 5 × 5 ft. Head tables (or any table with 16+ seats) draw as rectangles; the rest are round.</p></section>';
  }
  function initPlanDrag(){
    var svg=document.querySelector("#plan-host svg"); if(!svg) return;
    var drag=null;
    function pt(e){ var p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
    svg.addEventListener("pointerdown",function(e){
      var g=e.target.closest(".pi");
      if(!g){ if(selected){ selected=null; render(); } return; }
      var k=g.getAttribute("data-k"), o=objFor(k); if(!o) return;
      var p=pt(e); drag={g:g,k:k,o:o,dx:p.x-o.x,dy:p.y-o.y,x:o.x,y:o.y,moved:false};
      try{ svg.setPointerCapture(e.pointerId); }catch(_){}
      e.preventDefault();
    });
    svg.addEventListener("pointermove",function(e){
      if(!drag) return;
      var p=pt(e), W=Number(draft.room.width)||60, L=Number(draft.room.length)||40;
      var nx=Math.max(0,Math.min(W,Math.round((p.x-drag.dx)*2)/2)), ny=Math.max(0,Math.min(L,Math.round((p.y-drag.dy)*2)/2));
      if(nx!==drag.x||ny!==drag.y){ drag.x=nx; drag.y=ny; drag.moved=true; drag.g.setAttribute("transform","translate("+nx+" "+ny+")"); }
    });
    function end(){ if(!drag) return; var d=drag; drag=null; selected=d.k;
      if(d.moved){ d.o.x=d.x; d.o.y=d.y; changed(); } else render(); }
    svg.addEventListener("pointerup",end); svg.addEventListener("pointercancel",end);
  }
  function addFeature(label){
    ensureLayout(draft);
    var sz=FEAT_SIZES[label]||[8,4], f={id:uid(),label:label,x:Number(draft.room.width)/2,y:Number(draft.room.length)/2,w:sz[0],h:sz[1],rot:0};
    draft.features.push(f); selected="f:"+f.id; changed();
  }

  function render(){
    var focusId=document.activeElement&&document.activeElement.id;
    var seated=draft.tables.reduce(function(n,t){return n+t.guests.length;},0);
    var seats=draft.tables.reduce(function(n,t){return n+(Number(t.seats)||0);},0);
    var e=draft.event;
    var h='<div class="hostbar"><div class="hostbar-in"><strong>Seating admin</strong>'+
      '<span class="stats">'+seated+' seated · '+draft.unseated.length+' not seated · '+draft.tables.length+' tables · '+seats+' seats</span>'+
      (dirty?'<span class="chip">Unsaved changes</span>':'')+'<span class="spacer"></span>'+
      '<a class="btn" href="./" target="_blank" rel="noopener">Guest page</a>'+
      '<button type="button" class="btn'+(view==="tables"?' on':'')+'" data-act="view-tables">Tables</button>'+
      '<button type="button" class="btn'+(view==="plan"?' on':'')+'" data-act="view-plan">Floor plan</button>'+
      '<button type="button" class="btn" data-act="import-open">Paste a list</button>'+
      '<button type="button" class="btn" data-act="copy">Copy as text</button>'+
      (dirty?'<button type="button" class="btn" data-act="discard">Discard changes</button>':'<button type="button" class="btn" data-act="logout">Sign out</button>')+
      '<button type="button" class="btn primary" data-act="save"'+((!dirty||saving)?' disabled':'')+'>'+(saving?'Saving…':'Save for guests')+'</button>'+
      '</div></div><main class="wrap">';
    if(status) h+='<div class="notice '+(status.kind||'')+'" role="status">'+esc(status.text)+'</div>';
    if(draft.example) h+='<div class="notice warn">These are sample names. Replace them by hand or with <b>Paste a list</b>, then press <b>Save for guests</b>.</div>';
    if(importOpen){
      h+='<section class="notice import"><label for="imp"><b>Paste your seating list</b></label>'+
        '<p class="hint">One table per line: <code>Table name: Guest, Guest, Guest</code>. A line with no colon goes to Not seated. This replaces all current tables.</p>'+
        '<textarea id="imp" class="input">'+esc(toText(draft))+'</textarea>'+
        '<div class="row"><button type="button" class="btn primary" data-act="import-apply">Replace tables with this list</button><button type="button" class="btn" data-act="import-cancel">Cancel</button></div></section>';
    }
    if(view==="plan"){ h+=planSection()+'</main>'; } else {
    h+='<section class="event-fields">'+['title','subtitle','date','place'].map(function(k){
      var label={title:"Names",subtitle:"Event",date:"Date",place:"Place"}[k];
      return '<label class="field" for="ev-'+k+'">'+label+'<input id="ev-'+k+'" class="input ev" data-k="'+k+'" value="'+esc(e[k]||"")+'"></label>';
    }).join("")+'</section>';
    h+='<div class="grid">'+draft.tables.map(function(t){
      var over=t.guests.length>(Number(t.seats)||0);
      return '<article class="card host"><div class="card-head"><input id="name-'+esc(t.id)+'" class="t-name" data-t="'+esc(t.id)+'" value="'+esc(t.name)+'" aria-label="Table name"><span class="cap'+(over?' over':'')+'">'+t.guests.length+'/'+t.seats+'</span></div>'+
        '<div class="seats-row"><label for="seats-'+esc(t.id)+'">Seats <input id="seats-'+esc(t.id)+'" class="input t-seats" data-t="'+esc(t.id)+'" type="number" min="1" max="40" value="'+esc(t.seats)+'"></label>'+
        '<button type="button" class="btn small" data-act="del-table" data-t="'+esc(t.id)+'">Remove table</button></div>'+
        guestRows(t.id,t.guests)+addForm(t.id)+'</article>';
    }).join("")+
      '<article class="card host pool"><div class="card-head"><h3>Not seated</h3><span class="cap">'+draft.unseated.length+'</span></div><p class="hint">Hidden from guests. Removed tables send their guests here.</p>'+
      guestRows("__unseated",draft.unseated)+addForm("__unseated")+'</article>'+
      '<button type="button" class="addtable" data-act="add-table">+ Add a table</button></div></main>';
    }
    app.innerHTML=h;
    if(view==="plan") initPlanDrag(); else initDrag();
    if(focusId){var f=document.getElementById(focusId); if(f) f.focus();}
  }
  function changed(){ dirty=true; status=null; render(); }

  function parseImport(text){
    var tables=[],unseated=[];
    text.split(/\r?\n/).forEach(function(line){
      line=line.trim(); if(!line) return;
      var i=line.indexOf(":");
      if(i===-1){unseated=unseated.concat(splitNames(line));return;}
      var g=splitNames(line.slice(i+1));
      tables.push({id:uid(),name:line.slice(0,i).trim()||("Table "+(tables.length+1)),seats:Math.max(8,g.length),guests:g});
    });
    return {tables:tables,unseated:unseated};
  }

  function save(){
    if(saving||!dirty) return;
    saving=true; render();
    var out=clone(draft); out.example=false;
    ensureLayout(out);
    out.tables=out.tables.map(function(t){var o={name:t.name,seats:t.seats,guests:t.guests,x:t.x,y:t.y,rot:t.rot||0}; if(t.shape) o.shape=t.shape; return o;});
    gh("PUT",{message:"Update seating chart",content:b64encode(JSON.stringify(out,null,2)+"\n"),sha:sha,branch:BRANCH})
      .then(function(j){ sha=j.content.sha; saving=false; draft.example=false; saved=clone(draft); dirty=false;
        status={kind:"ok",text:"Saved. The guest page updates within a few minutes. Guests who already have it open may need to refresh."}; render(); })
      .catch(function(e){ saving=false;
        if(e.status===409||/does not match/i.test(e.message)) status={kind:"warn",text:"The seating was changed somewhere else since you opened it. Copy your changes as text, then reload this page."};
        else if(e.status===401||e.status===403) status={kind:"warn",text:"Your token can't save ("+e.message+"). It needs Contents: Read and write on johnathonandmelissa.github.io."};
        else status={kind:"warn",text:"Couldn't save ("+e.message+"). Check your connection and press Save again."};
        render(); });
  }

  app.addEventListener("click",function(ev){
    var b=ev.target.closest("[data-act]"); if(!b) return;
    var act=b.getAttribute("data-act"), id=b.getAttribute("data-t");
    if(act==="login") return login();
    if(act==="save") return save();
    if(act==="view-tables"||act==="view-plan"){ view=act==="view-plan"?"plan":"tables"; selected=null; render(); window.scrollTo(0,0); return; }
    if(act==="p-add") return addFeature(b.getAttribute("data-label"));
    if(act==="p-add-custom"){ var fl=document.getElementById("feat-label").value.trim(); if(fl) addFeature(fl); return; }
    if(act==="p-done"){ selected=null; return render(); }
    if(act==="p-rotate"){ var po=objFor(selected); if(po){ po.rot=po.rot?0:90; changed(); } return; }
    if(act==="p-shape"){ var pt2=objFor(selected); if(pt2){ pt2.shape=isRect(pt2)?"round":"rect"; changed(); } return; }
    if(act==="p-remove"){ var fid=selected&&selected.slice(2); draft.features=(draft.features||[]).filter(function(f){return f.id!==fid;}); selected=null; changed(); return; }
    if(act==="logout"){ lsSet(TOKEN_KEY,null); token=null; return renderLogin(); }
    if(act==="discard"){ draft=clone(saved); dirty=false; status=null; return render(); }
    if(act==="import-open"){ importOpen=true; render(); var t=document.getElementById("imp"); if(t) t.focus(); return; }
    if(act==="import-cancel"){ importOpen=false; return render(); }
    if(act==="import-apply"){ var p=parseImport(document.getElementById("imp").value); draft.tables=p.tables; draft.unseated=p.unseated; draft.example=false; importOpen=false; return changed(); }
    if(act==="copy"){
      var txt=toText(draft);
      if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(function(){status={kind:"ok",text:"Seating copied as text."};render();},function(){importOpen=true;render();}); }
      else { importOpen=true; render(); }
      return;
    }
    if(act==="add-table"){ var nId=uid(); draft.tables.push({id:nId,name:"Table "+draft.tables.length,seats:8,guests:[]}); changed(); var n=document.getElementById("name-"+nId); if(n){n.focus();n.select();} return; }
    if(act==="del-table"){ var idx=draft.tables.findIndex(function(t){return t.id===id;}); if(idx>-1){ draft.unseated=draft.unseated.concat(draft.tables[idx].guests); draft.tables.splice(idx,1); changed(); } return; }
    if(act==="up"||act==="down"){
      var L2=listFor(id), gi=Number(b.getAttribute("data-g")), to=act==="up"?gi-1:gi+1;
      if(L2&&to>=0&&to<L2.length){ var tmp=L2[gi]; L2[gi]=L2[to]; L2[to]=tmp; changed();
        var nb=document.getElementById(act+"-"+id+"-"+to); if(nb&&!nb.disabled) nb.focus(); }
      return;
    }
    if(act==="del-guest"){ var l=listFor(id); if(l){ l.splice(Number(b.getAttribute("data-g")),1); changed(); } }
  });
  app.addEventListener("change",function(ev){
    if(!draft) return;
    var pe=ev.target;
    if(pe.classList.contains("rm")){ ensureLayout(draft); draft.room[pe.getAttribute("data-k")]=Math.max(10,Math.min(400,Number(pe.value)||60)); keepInRoom(draft); changed(); return; }
    if(pe.id==="showplan"){ draft.showPlan=pe.checked; changed(); return; }
    if(pe.classList.contains("f-edit")){ var fo=objFor(selected); if(fo){ var fk=pe.getAttribute("data-k");
      if(fk==="label"){ if(pe.value.trim()) fo.label=pe.value.trim(); } else fo[fk]=Math.max(1,Math.min(200,Number(pe.value)||1)); changed(); } return; }
    var el=ev.target, id=el.getAttribute("data-t");
    if(el.classList.contains("t-name")){ var t=draft.tables.find(function(x){return x.id===id;}); if(t){ t.name=el.value.trim()||t.name; changed(); } }
    else if(el.classList.contains("t-seats")){ var t2=draft.tables.find(function(x){return x.id===id;}); if(t2){ t2.seats=Math.max(1,Math.min(40,parseInt(el.value,10)||1)); changed(); } }
    else if(el.classList.contains("g-name")){
      var L3=listFor(id), gj=Number(el.getAttribute("data-g")), nv=el.value.trim();
      if(L3){ if(nv&&nv!==L3[gj]){ L3[gj]=nv; changed(); } else { el.value=L3[gj]; } }
    }
    else if(el.classList.contains("g-move")){ var from=listFor(id),to=listFor(el.value),gi=Number(el.getAttribute("data-g")); if(from&&to&&from!==to){ to.push(from.splice(gi,1)[0]); changed(); } }
    else if(el.classList.contains("ev")){ draft.event[el.getAttribute("data-k")]=el.value.trim(); changed(); }
  });
  app.addEventListener("submit",function(ev){
    var f=ev.target.closest("form.add"); if(!f) return; ev.preventDefault();
    var id=f.getAttribute("data-t"), names=splitNames(f.querySelector("input").value); if(!names.length) return;
    var l=listFor(id); if(!l) return; names.forEach(function(n){l.push(n);}); changed();
    var again=document.getElementById("add-"+id); if(again) again.focus();
  });
  window.addEventListener("beforeunload",function(e){ if(dirty){ e.preventDefault(); e.returnValue=""; } });

  token=lsGet(TOKEN_KEY);
  if(token) load(); else renderLogin();
})();
</script>
</body>
</html>
